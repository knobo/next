# The next presentation at aiagent.knobo.no. *.knobo.no already reaches this Traefik
# (TLS ends at the proxy in front), so an Ingress on the `web` entrypoint is enough.
#   ./deploy.sh
apiVersion: v1
kind: Namespace
metadata: { name: next-slides }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: slides, namespace: next-slides }
spec:
  replicas: 1
  selector: { matchLabels: { app: slides } }
  template:
    metadata: { labels: { app: slides } }
    spec:
      imagePullSecrets: [{ name: forgejo-registry }]
      securityContext: { runAsNonRoot: true }
      containers:
        - name: slides
          image: IMAGE
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
          readinessProbe: { httpGet: { path: /, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: slides, namespace: next-slides }
spec:
  selector: { app: slides }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slides
  namespace: next-slides
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: aiagent.knobo.no
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: slides, port: { number: 80 } } } }
